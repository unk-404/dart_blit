name: CI

# Runs on every push / PR.  On push/manual branch runs, a Windows benchmark job
# runs after all tests, renders assets/benchmarks.svg and commits it with
# [skip ci]; PR runs stop after the tests.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark_gb:
        description: "Random-benchmark file size in GiB (hosted runners: 4 is safe; 8+ may exhaust disk)."
        required: false
        default: "4"
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep pub's telemetry/analytics out of CI logs.
  PUB_ENVIRONMENT: blit_ci

jobs:
  # ---------------------------------------------------------------------------
  # Core package: analyze + VM tests on all three desktop OSes.
  # ---------------------------------------------------------------------------
  dart:
    name: Dart / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          # Pinned to the SDK the project is developed against.  Bump together
          # with pubspec.yaml's environment constraint.
          sdk: 3.13.5

      - name: Show Dart version
        run: dart --version

      - name: dart pub get
        run: dart pub get

      - name: dart analyze
        run: dart analyze

      # Discover VM tests instead of hard-coding paths so that new test
      # directories (test/native, test/windows, ...) are picked up
      # automatically.  Browser tests (test/web) run in the `web` job, and
      # POSIX-only tests are skipped on Windows.
      - name: dart test (VM)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            files=$(find test -name '*_test.dart' \
              ! -path 'test/web/*' \
              ! -path '*posix*' | sort)
          else
            files=$(find test -name '*_test.dart' \
              ! -path 'test/web/*' | sort)
          fi
          if [ -z "${files}" ]; then
            echo "::error title=No tests found::No *_test.dart files discovered under test/"
            exit 1
          fi
          echo "VM test files:"
          echo "${files}"
          # shellcheck disable=SC2086  # paths never contain spaces in CI
          dart test ${files}

      - name: Run native example
        run: dart run example/bytes_example.dart

  # ---------------------------------------------------------------------------
  # Web: core types + (when it lands) the OPFS engine, in a real browser.
  # ---------------------------------------------------------------------------
  web:
    name: Web / Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5

      - name: Show Dart version
        run: dart --version

      - name: dart pub get
        run: dart pub get

      - name: Check Chrome
        run: google-chrome --version

      # The OPFS backend is landing in parallel; run the browser suite only
      # when test/web actually contains tests.  Never fail just because the
      # directory does not exist yet.
      - name: dart test -p chrome (test/web + core fuzz)
        if: ${{ hashFiles('test/web/**/*_test.dart') != '' }}
        run: dart test -p chrome test/web test/bytes_fuzz_test.dart

      - name: Web tests pending
        if: ${{ hashFiles('test/web/**/*_test.dart') == '' }}
        run: |
          echo "::notice title=Web runtime tests skipped::test/web has no *_test.dart yet (OPFS backend in progress)."

      # Must compile: proves the default import (package:blit/bytes.dart) is
      # web-safe (no dart:io / dart:ffi leak).
      - name: Compile web example with dart2js
        run: |
          mkdir -p build/web
          dart compile js example/bytes_web_example.dart \
            -o build/web/bytes_web_example.js
          test -s build/web/bytes_web_example.js

  # ---------------------------------------------------------------------------
  # Rust counterpart benchmarks.  Windows measures IOCP, Ubuntu measures
  # io_uring; the chart job merges both JSONL files with the Dart series.
  # ---------------------------------------------------------------------------
  rust-bench:
    name: Rust benchmark / ${{ matrix.artifact }}
    needs: [dart, web]
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            feature: iocp
            artifact: bench-rust-windows
          - os: ubuntu-latest
            feature: uring
            artifact: bench-rust-linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: benchmark/rust -> target
      - name: Run Rust benchmark
        shell: bash
        run: |
          set -euo pipefail
          cd benchmark/rust
          cargo run --release --features "${{ matrix.feature }}" \
            -- bench-rust.bin > "$GITHUB_WORKSPACE/${{ matrix.artifact }}.jsonl"
          test -s "$GITHUB_WORKSPACE/${{ matrix.artifact }}.jsonl"
      - name: Upload Rust benchmark data
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.jsonl
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Dart io_uring benchmark on Ubuntu.  This is deliberately separate from the
  # Rust uring benchmark: it exercises blit's UringBytesFile, not the Rust crate.
  # ---------------------------------------------------------------------------
  dart-uring-bench:
    name: Dart io_uring benchmark
    needs: [dart, web]
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5
      - name: Dart pub get
        run: dart pub get
      - name: Run Dart io_uring benchmark
        shell: bash
        run: |
          set -euo pipefail
          dart run benchmark_test --output jsonl \
            benchmark/uring_benchmarks_test.dart 2> bench-uring.stderr.log \
            | grep '^{' > bench-uring.jsonl
          test -s bench-uring.jsonl
      - name: Upload Dart io_uring data
        uses: actions/upload-artifact@v4
        with:
          name: bench-dart-uring
          path: bench-uring.jsonl
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # After all tests pass: benchmark on Windows, render the README SVG, upload
  # artifacts, and (on push/manual runs) commit the updated SVG.
  #
  # Recursion guard: a push made with the default GITHUB_TOKEN does not trigger
  # a new workflow run, and the commit message also carries [skip ci].
  # ---------------------------------------------------------------------------
  benchmark-svg:
    name: Benchmark + SVG
    needs: [dart, web, rust-bench, dart-uring-bench]
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Rust Windows benchmark
        uses: actions/download-artifact@v4
        with:
          name: bench-rust-windows
          path: .
      - name: Download Rust Linux benchmark
        uses: actions/download-artifact@v4
        with:
          name: bench-rust-linux
          path: .
      - name: Download Dart io_uring benchmark
        uses: actions/download-artifact@v4
        with:
          name: bench-dart-uring
          path: .

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5

      - name: Dart pub get
        run: dart pub get

      - name: Benchmark core + 1 GiB + pool
        shell: pwsh
        env:
          BYTES_BENCH_MAX_WORKERS: "8"
        run: |
          $output = & dart run benchmark_test --output jsonl `
            benchmark/benchmarks_test.dart 2> bench-core.stderr.log
          $code = $LASTEXITCODE
          $output | Where-Object { $_ -match '^\s*\{' } |
            Set-Content -Encoding utf8 bench-core.jsonl
          $output | Select-Object -Last 5
          if ($code -ne 0) {
            if (Test-Path bench-core.stderr.log) {
              Write-Host '--- benchmark stderr ---'
              Get-Content bench-core.stderr.log
            }
            exit $code
          }

      - name: Benchmark random 4 GiB
        shell: pwsh
        env:
          BYTES_BENCH_GB: ${{ github.event.inputs.benchmark_gb || '4' }}
        run: |
          $output = & dart run benchmark_test --output jsonl `
            benchmark/random_32g_benchmarks_test.dart 2> bench-random.stderr.log
          $code = $LASTEXITCODE
          $output | Where-Object { $_ -match '^\s*\{' } |
            Set-Content -Encoding utf8 bench-random.jsonl
          $output | Select-Object -Last 5
          if ($code -ne 0) {
            if (Test-Path bench-random.stderr.log) {
              Write-Host '--- benchmark stderr ---'
              Get-Content bench-random.stderr.log
            }
            exit $code
          }

      - name: Benchmark IOCP QD sweep
        shell: pwsh
        run: |
          $output = & dart run benchmark_test --output jsonl `
            benchmark/iocp_benchmarks_test.dart 2> bench-iocp.stderr.log
          $code = $LASTEXITCODE
          $output | Where-Object { $_ -match '^\s*\{' } |
            Set-Content -Encoding utf8 bench-iocp.jsonl
          $output | Select-Object -Last 5
          if ($code -ne 0) {
            if (Test-Path bench-iocp.stderr.log) {
              Write-Host '--- benchmark stderr ---'
              Get-Content bench-iocp.stderr.log
            }
            exit $code
          }

      - name: Benchmark core bytes
        shell: pwsh
        run: |
          $output = & dart run benchmark_test --output jsonl `
            benchmark/bytes_benchmarks_test.dart 2> bench-bytes.stderr.log
          $code = $LASTEXITCODE
          $output | Where-Object { $_ -match '^\s*\{' } |
            Set-Content -Encoding utf8 bench-bytes.jsonl
          $output | Select-Object -Last 5
          if ($code -ne 0) {
            if (Test-Path bench-bytes.stderr.log) {
              Write-Host '--- bytes benchmark stderr ---'
              Get-Content bench-bytes.stderr.log
            }
            exit $code
          }

      - name: Combine Dart benchmark data
        shell: pwsh
        run: |
          Get-Content bench-core.jsonl, bench-random.jsonl, bench-iocp.jsonl, `
            bench-bytes.jsonl, bench-uring.jsonl |
            Set-Content -Encoding utf8 bench-dart.jsonl

      - name: Render benchmark SVG
        # The action installs benchcat itself; inputs come from [[series]] in
        # benchcat.toml, so no positional input is needed.
        uses: unk-404/benchcat@master
        with:
          format: benchmark_test
          out: assets/benchmarks.svg
          config: benchcat.toml

      - name: Verify benchmark SVG
        shell: pwsh
        run: |
          if (!(Test-Path assets/benchmarks.svg)) {
            throw 'benchcat did not write assets/benchmarks.svg'
          }
          if ((Get-Item assets/benchmarks.svg).Length -le 0) {
            throw 'assets/benchmarks.svg is empty'
          }
          $head = Get-Content assets/benchmarks.svg -TotalCount 1
          if ($head -notmatch '^\s*<\?xml') {
            throw "assets/benchmarks.svg does not start with <?xml: $head"
          }

      - name: Upload benchmark data + SVG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blit-benchmark-svg
          path: |
            bench-*.jsonl
            bench-*.stderr.log
            assets/benchmarks.svg
          if-no-files-found: ignore

      - name: Commit updated SVG
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/benchmarks.svg
          if (git diff --cached --quiet) {
            Write-Host "benchmark SVG unchanged"
            exit 0
          }
          git commit -m "chore(bench): update benchmark SVG [skip ci]"
          git push
