name: Benchmark (Windows)

# Manual only: the 32 GiB run materialises a large file and takes minutes.
# All benchmarks use package:benchmark_test (JIT/AOT, ops/sec + RME, JSONL).

on:
  workflow_dispatch:
    inputs:
      size_gb:
        description: Logical file size in GiB for the random benchmark.
        required: true
        default: "32"
        type: string
      compile_aot:
        description: Compile the 1 GiB suite with both JIT and AOT.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench-windows:
    name: Windows / ${{ inputs.size_gb }} GiB
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.13.5

      - name: Show Dart version
        run: dart --version

      - name: Dart pub get
        run: dart pub get

      - name: Show disk space
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, @{n = 'FreeGiB'; e = { [math]::Round($_.Free / 1GB, 1) } }

      - name: Core + 1 GiB + pool (benchmark_test)
        shell: pwsh
        run: |
          $compile = '${{ inputs.compile_aot }}'
          $targets = if ($compile -eq 'true') { 'jit,aot' } else { 'jit' }
          $output = & dart run benchmark_test --compile $targets `
            --output jsonl benchmark/benchmarks_test.dart 2> bench-core.stderr.log
          $code = $LASTEXITCODE
          $json = $output | Where-Object { $_ -match '^\s*\{' }
          $json | Set-Content -Encoding utf8 bench-core.jsonl
          $output | Select-Object -Last 5
          if ($code -ne 0) { exit $code }

      - name: Random 4K benchmark (benchmark_test)
        shell: pwsh
        run: |
          $env:BYTES_BENCH_GB = '${{ inputs.size_gb }}'
          $output = & dart run benchmark_test --output jsonl `
            benchmark/random_32g_benchmarks_test.dart 2> bench-random.stderr.log
          $code = $LASTEXITCODE
          $json = $output | Where-Object { $_ -match '^\s*\{' }
          $json | Set-Content -Encoding utf8 bench-random.jsonl
          $output | Select-Object -Last 5
          if ($code -ne 0) { exit $code }

      - name: Windows IOCP QD sweep (benchmark_test)
        shell: pwsh
        run: |
          $output = & dart run benchmark_test --output jsonl `
            benchmark/iocp_benchmarks_test.dart 2> bench-iocp.stderr.log
          $code = $LASTEXITCODE
          $json = $output | Where-Object { $_ -match '^\s*\{' }
          $json | Set-Content -Encoding utf8 bench-iocp.jsonl
          $output | Select-Object -Last 5
          if ($code -ne 0) { exit $code }

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blit-bench-${{ inputs.size_gb }}g
          path: bench-*.jsonl
          if-no-files-found: ignore
