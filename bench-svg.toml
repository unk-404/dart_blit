# Rendered by bench-svg (https://github.com/unk-404/benchmark_svg).
# Two series: Dart and the C counterpart. CI passes the TTF via --font-file.
[render]
title = "blit vs C"
subtitle = "{os|local} · Dart vs C · {commit:short|local}"
footer = "Generated from {rows} rows"
width = 920
min_height = 0
max_rows = 15
only_matched = true
missing = "placeholder"
kaomoji = "(◕‿◕)♡"

[[series]]
label = "Dart"
input = "bench-dart.jsonl"
format = "benchmark_test"
color = "#7FD1B9"

[[series]]
label = "C"
input = "bench-c.jsonl"
format = "benchmark_test"
color = "#FFB7C5"

# File I/O (1 GiB file).
[[row]]
id = "file.read.8MiB"
label = "Sequential read"
note = "8 MiB blocks · 1 GiB file"
unit = "GiB/s"
value = "value * 8 / 1024"
group = "File I/O"

[[row]]
id = "file.write.8MiB"
label = "Sequential write"
note = "8 MiB blocks · 1 GiB file"
unit = "GiB/s"
value = "value * 8 / 1024"
group = "File I/O"

[[row]]
id = "file.read.random4K"
label = "Random pread"
note = "4 KiB · 1 GiB file"
unit = "IOPS"
group = "File I/O"

[[row]]
id = "file.write.random4K"
label = "Random pwrite"
note = "4 KiB · 1 GiB file · buffered"
unit = "IOPS"
group = "File I/O"

# mmap.
[[row]]
id = "mmap.read.random4K"
label = "mmap read"
note = "4 KiB random · 1 GiB mapping"
unit = "IOPS"
group = "mmap"

[[row]]
id = "mmap.write.random4K"
label = "mmap write"
note = "4 KiB random · 1 GiB mapping"
unit = "IOPS"
group = "mmap"

# Dart-only engines: C has no equivalent implementation, so these rows keep a
# placeholder C track.
[[row]]
match = 'pool\.read\.random4K\.w(\d+)$'
label = "Pool read · $1 workers"
note = "Dart isolate pool · 4 KiB · batch 32"
unit = "IOPS"
value = "value * $1 * 32"
group = "Dart pool"

[[row]]
match = 'pool\.read\.sequential4K\.w(\d+)$'
label = "Pool sequential"
note = "Dart isolate pool · 4 KiB · coalesced"
unit = "IOPS"
value = "value * 32"
group = "Dart pool"

[[row]]
match = 'random(\d+)g\.pread\.read\.random4K$'
label = "Large random pread"
note = "Dart · 4 KiB · $1 GiB file"
unit = "IOPS"
group = "Dart large file"

[[row]]
match = 'random(\d+)g\.pwrite\.write\.random4K$'
label = "Large random pwrite"
note = "Dart · 4 KiB · $1 GiB file · buffered"
unit = "IOPS"
group = "Dart large file"

[[row]]
id = "iocp.read.random4K.qd32"
label = "IOCP read · QD32"
note = "Dart · Windows · single worker"
unit = "IOPS"
value = "value * 32"
group = "Dart IOCP"

[[row]]
id = "iocp.write.random4K.qd32"
label = "IOCP write · QD32"
note = "Dart · Windows · single worker · buffered"
unit = "IOPS"
value = "value * 32"
group = "Dart IOCP"
