# Rendered by benchcat (https://github.com/unk-404/benchcat).
# One chart: native I/O (Dart vs Rust) plus core Bytes (Dart-only placeholder).
[render]
title = "blit vs Rust"
subtitle = "{os|local} - Dart vs Rust - {commit:short|local}"
footer = "Generated from {rows} rows"
width = 920
min_height = 0
max_rows = 48
only_matched = true
missing = "placeholder"
kaomoji = "(^_^)"

[[series]]
label = "Dart"
input = "bench-dart.jsonl"
format = "benchmark_test"
color = "#7FD1B9"

[[series]]
label = "Rust Windows"
input = "bench-rust-windows.jsonl"
format = "benchmark_test"
color = "#FFB7C5"

[[series]]
label = "Rust Linux"
input = "bench-rust-linux.jsonl"
format = "benchmark_test"
color = "#8CB8F0"

# File I/O (1 GiB file).
[[row]]
id = "file.read.8MiB"
label = "Sequential read"
note = "8 MiB blocks - 1 GiB file - warm cache"
unit = "GiB/s"
value = "value * 8 / 1024"
group = "File I/O"

[[row]]
id = "file.write.8MiB"
label = "Sequential write"
note = "8 MiB blocks - 1 GiB file - warm cache"
unit = "GiB/s"
value = "value * 8 / 1024"
group = "File I/O"

[[row]]
id = "file.read.pointer8MiB"
label = "Pointer read"
note = "8 MiB into native buffer - no typed-data copy"
unit = "GiB/s"
value = "value * 8 / 1024"
group = "File I/O"

[[row]]
id = "file.write.pointer8MiB"
label = "Pointer write"
note = "8 MiB from native buffer - no typed-data copy"
unit = "GiB/s"
value = "value * 8 / 1024"
group = "File I/O"

[[row]]
id = "file.read.random4K"
